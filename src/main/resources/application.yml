server:
  port: ${SUPPORT_SERVICE_PORT:8084}

spring:
  application:
    name: bytemarket-support-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_SUPPORT:bytemarket_support}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      # El libro de reclamaciones acepta adjuntos; el límite de 1 MB que trae
      # Spring por defecto cortaba la subida antes de llegar al controlador.
      max-file-size: 5MB
      max-request-size: 10MB
  # ── Mensajería ───────────────────────────────────────────────
  # Este servicio solo CONSUME, y solo de Kafka: lee bytemarket.pedidos para
  # avisar al cliente de cada cambio de estado de su pedido. La cola de
  # RabbitMQ es cosa de catalog y order (el descuento de stock) y aquí no se
  # usa; la sección se queda porque el .env la rellena para todos.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      # El grupo es lo que hace que varias instancias de support-service se
      # repartan las particiones en vez de que todas manden el mismo correo.
      # Y es lo que permitirá que mañana otro consumidor (métricas, por
      # ejemplo) lea los MISMOS eventos con su propio grupo y su propio
      # avance, sin quitárselos a este.
      group-id: ${KAFKA_GROUP:bytemarket-support-notificaciones}
      # earliest para que un support-service recién levantado recupere los
      # eventos que ocurrieron mientras estaba apagado. Es seguro porque el
      # envío es idempotente: ver OrderNotificationService.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # El productor no manda la cabecera con su nombre de clase, así que
        # hay que decir aquí a qué tipo se mapea el JSON.
        spring.json.value.default.type: com.bytemarket.support.messaging.PedidoEvento
        spring.json.trusted.packages: com.bytemarket.support.messaging
    listener:
      # Se confirma el offset DESPUÉS de procesar, no al recibir. Si el
      # servicio muere a medio enviar, el evento se vuelve a leer en vez de
      # darse por avisado sin haberlo estado.
      ack-mode: record

# ── Adjuntos del libro de reclamaciones ──────────────────────
# Relativo al directorio de trabajo. En Docker el WORKDIR es /app, así que
# acaba en /app/uploads/complaints, y el compose monta un volumen ahí: en la
# capa de escritura del contenedor los adjuntos desaparecerían en cuanto se
# actualice la imagen.
attachments:
  dir: ${ATTACHMENTS_DIR:uploads/complaints}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Valores por defecto para cuando se arranca sin el perfil local. Tienen que
# coincidir con application-local.yml: si el secreto diverge, este servicio
# rechaza los tokens que firma user-service.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}

# ── Sonda de salud ───────────────────────────────────────────
# Solo se expone "health": los demás endpoints del actuator (env, beans,
# mappings) revelan configuración interna y no hacen falta aquí.
# Lo consulta el healthcheck de Docker, que así espera a que el servicio
# esté REALMENTE listo —base de datos incluida— y no solo a que el puerto
# responda.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # El estado del SMTP NO cuenta para la salud de este servicio.
    #
    # Spring añade un MailHealthIndicator que se autentica contra Gmail en
    # cada sondeo. Con las credenciales caducadas devolvía DOWN, el
    # /actuator/health respondía 503, y Docker daba el contenedor por
    # enfermo: dejaba de recibir tráfico y el gateway no arrancaba. Es decir,
    # una contraseña de aplicación vencida tumbaba el libro de reclamaciones
    # entero.
    #
    # Y es una respuesta equivocada a la pregunta que hace la sonda. "¿Puede
    # este servicio atender peticiones?" sigue siendo sí: los reclamos se
    # registran, se consultan y el consumidor de Kafka sigue procesando
    # eventos —anotándolos con enviado=false, que para eso está esa columna—.
    # Un correo que no sale es una función degradada, no un servicio muerto.
    mail:
      enabled: false
