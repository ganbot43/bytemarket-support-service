# Perfil local.
#
# Aquí NO van credenciales: este archivo se versiona. Los valores reales
# viven en el .env de este mismo directorio, que está en .gitignore.
# Copia .env.example a .env y rellénalo antes de arrancar.
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}

# El secreto debe ser idéntico en los cuatro servicios de negocio:
# user-service firma el token y catalog, order y support verifican la firma.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    # Sin esto Gmail corta la conexión con "530 5.7.0 Must issue a STARTTLS
    # command first" y NINGÚN correo sale: ni el de resolución de reclamos ni
    # el aviso de estado del pedido. El 587 es el puerto de STARTTLS —se abre
    # en claro y se cifra con el comando—, y Spring no lo activa por su
    # cuenta. Se vio al probar el aviso de pedidos de punta a punta: el
    # evento llegaba, la plantilla se generaba y el envío moría aquí.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Un SMTP que no responde no puede dejar colgado al consumidor de
          # Kafka: sin estos tiempos, el hilo del listener esperaría
          # indefinidamente y el resto de eventos no se procesaría.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
