<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        .header { background-color: #B01883; color: #ffffff; padding: 15px; border-radius: 8px 8px 0 0; text-align: center; }
        .content { padding: 20px; color: #333333; line-height: 1.6; }
        .footer { margin-top: 20px; font-size: 12px; color: #777777; text-align: center; }
        .estado-box { border-left: 4px solid #B01883; padding: 15px; margin: 20px 0; background-color: #fafafa; border-radius: 0 8px 8px 0; }
        .pedido { font-size: 13px; color: #555555; }
        .total { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin: 0;" th:text="${titulo}">Estado de tu pedido</h2>
        </div>
        <div class="content">
            <p>Hola <strong th:text="${customerName}">Cliente</strong>,</p>

            <div class="estado-box" th:text="${mensaje}">
                Mensaje del estado aquí...
            </div>

            <p class="pedido">
                Pedido <strong th:text="${orderCode}">BM-XXXXXXXX-XXXX</strong>
                <span th:if="${total != null}">
                    — total <span class="total" th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 2)}">S/ 0.00</span>
                </span>
            </p>

            <p>Puedes seguir tu pedido desde <strong>Mi cuenta &gt; Mis pedidos</strong> en la tienda.</p>
        </div>
        <div class="footer">
            <p>Este es un correo automático de ByteMarket. Si tienes dudas, responde a este mensaje.</p>
        </div>
    </div>
</body>
</html>
