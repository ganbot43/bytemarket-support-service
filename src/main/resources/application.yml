server:
  port: ${SUPPORT_SERVICE_PORT:8084}

spring:
  application:
    name: bytemarket-support-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_SUPPORT:bytemarket_support}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      # El libro de reclamaciones acepta adjuntos; el límite de 1 MB que trae
      # Spring por defecto cortaba la subida antes de llegar al controlador.
      max-file-size: 5MB
      max-request-size: 10MB
  # Mensajería: preparada, todavía sin usar. Hoy es inerte porque ningún
  # pom.xml incluye AMQP ni Kafka. Para activarla, añadir al pom
  # spring-boot-starter-amqp o spring-kafka (ambos ya en docker-compose).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:bytemarket-support}
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Valores por defecto para cuando se arranca sin el perfil local. Tienen que
# coincidir con application-local.yml: si el secreto diverge, este servicio
# rechaza los tokens que firma user-service.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}
